<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שאלון | מרקמן טומשין ושות'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#efefef;font-family:Heebo,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1a1a1a;text-decoration:none}
a:hover{color:#6b6b6b}
input{font-family:inherit}
input::placeholder{color:#a8a8a8}
#navBtn{display:none!important}
@media (max-width:720px){
#navBtn{display:inline-flex!important;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #dcdcdc;background:#fafafa;font-size:18px;line-height:1;color:#3a3a3a;cursor:pointer;flex:0 0 auto;order:2;margin-inline-start:auto}
#navChk:checked+#navBtn{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
#navLinks{display:none!important;order:3}
#navChk:checked~#navLinks{display:flex!important;flex-direction:column;align-items:stretch;width:100%;gap:0;border-top:1px solid #ececec;margin-top:4px}
#navChk:checked~#navLinks>a{padding:14px 2px;border-bottom:1px solid #ececec;font-size:15px}
#navChk:checked~#navLinks>a:last-child{margin-top:12px;text-align:center;border-bottom:none;padding:14px 0}
#navChk:checked~#navLinks>span{padding:14px 2px}
}
summary::-webkit-details-marker{display:none}
summary::marker{content:""}
@media (max-width:720px){
#navLinks details>div{position:static!important;border:none!important;box-shadow:none!important;min-width:0!important;margin-top:6px}
#navLinks details>div>a{padding:12px 10px!important}
#navChk:checked~#navLinks>details{padding:14px 2px;border-bottom:1px solid #ececec;font-size:15px}
}
</style>
</head>
<body>
<div dir="rtl" style="background:#efefef;padding:clamp(10px,3vw,28px) clamp(8px,3vw,16px);min-height:100vh;box-sizing:border-box">
<div style="max-width:720px;margin:0 auto;background:#fff;border:1px solid #d6d6d6">

  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;padding:14px clamp(14px,3vw,22px);border-bottom:1px solid #e0e0e0">
    <input type="checkbox" id="navChk" style="display:none">
    <label for="navChk" id="navBtn" aria-label="תפריט">☰</label>
    <a href="index.html" style="display:flex;align-items:center;gap:10px;flex:0 0 auto"><img src="assets/logo.jpg" alt="מרקמן טומשין ושות'" style="height:30px;width:30px;object-fit:cover;border-radius:2px"><span style="font-size:13px;font-weight:500;white-space:nowrap">מרקמן טומשין ושות'</span></a>
    <div id="navLinks" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;font-size:13px;color:#3a3a3a">
      <a href="index.html">ראשי</a>
      <details style="position:relative">
        <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;">מוצרים<span style="color:#9a9a9a;font-size:10px">▾</span></summary>
        <div style="position:absolute;top:calc(100% + 12px);inset-inline-start:0;z-index:30;background:#fff;border:1px solid #dcdcdc;min-width:210px;display:flex;flex-direction:column;box-shadow:0 8px 20px rgba(0,0,0,.08)">
          <a href="will.html" style="padding:12px 14px;border-bottom:1px solid #ececec;font-size:13px">צוואה</a>
          <a href="power-of-attorney.html" style="padding:12px 14px;border-bottom:1px solid #ececec;font-size:13px">ייפוי כוח מתמשך</a>
          <a href="bundle.html" style="padding:12px 14px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px">צוואה + ייפוי כוח<span style="background:#2b2b2b;color:#fff;font-size:10px;padding:2px 7px">מומלץ</span></a>
        </div>
      </details>
      <a href="contact.html">צור קשר</a>
      <span style="font-size:12px;color:#8a8a8a">שלב <b id="stepNum">1</b> מתוך 7</span>
    </div>
  </div>

  <div style="height:4px;background:#e6e6e6">
    <div id="bar" style="height:4px;background:#2b2b2b;width:14%"></div>
  </div>

  <div style="padding:clamp(28px,5vw,44px) clamp(18px,4vw,44px) 8px;min-height:min(330px,52vh);box-sizing:border-box">
    <div id="kicker" style="font-size:12px;letter-spacing:.08em;color:#9a9a9a;margin-bottom:12px"></div>
    <h1 id="question" style="margin:0 0 6px;font-size:clamp(20px,4vw,24px);line-height:1.5;font-weight:700;color:#161616;text-wrap:pretty"></h1>
    <p id="hint" style="margin:0 0 26px;font-size:13px;color:#8a8a8a"></p>
    <div id="options" style="display:flex;flex-direction:column;gap:12px"></div>
    <div id="resultNote" style="display:none;border:1px solid #2b2b2b;background:#fbfbfb;padding:16px 18px;margin-bottom:22px">
      <div style="font-size:14px;font-weight:700;color:#161616;margin-bottom:6px">ההמלצה שלנו: צוואה + ייפוי כוח מתמשך</div>
      <p style="margin:0 0 12px;font-size:13px;line-height:1.75;color:#6b6b6b">שני המסמכים בתהליך אחד — שאלון אחד, פגישת חתימה אחת ועלות מופחתת.</p>
      <a href="bundle.html" style="font-size:13px;color:#2b2b2b;font-weight:500">לפרטי החבילה ←</a>
    </div>
    <div id="contactStep" style="display:none;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
      <label style="display:flex;flex-direction:column;gap:7px;font-size:13px;color:#3a3a3a;grid-column:1/-1">שם מלא
        <input type="text" id="cName" placeholder="ישראל ישראלי" style="border:1px solid #dcdcdc;background:#fafafa;padding:12px;font-size:14px;color:#1a1a1a">
      </label>
      <label style="display:flex;flex-direction:column;gap:7px;font-size:13px;color:#3a3a3a">טלפון
        <input type="tel" id="cPhone" placeholder="050-0000000" style="border:1px solid #dcdcdc;background:#fafafa;padding:12px;font-size:14px;color:#1a1a1a">
      </label>
      <label style="display:flex;flex-direction:column;gap:7px;font-size:13px;color:#3a3a3a">דוא"ל
        <input type="email" id="cMail" placeholder="name@example.com" style="border:1px solid #dcdcdc;background:#fafafa;padding:12px;font-size:14px;color:#1a1a1a">
      </label>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px clamp(18px,4vw,44px) 36px">
    <button type="button" id="back" style="background:none;border:none;font-family:inherit;font-size:13px;color:#6b6b6b;cursor:pointer;padding:0">→ חזרה</button>
    <button type="button" id="next" style="border:none;font-family:inherit;font-size:14px;padding:13px 34px;color:#fff;background:#bdbdbd;cursor:not-allowed">המשך ←</button>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px clamp(14px,3vw,22px);border-top:1px solid #e0e0e0;font-size:12px;color:#8a8a8a">
    <span>מרקמן טומשין ושות'</span>
    <div style="display:flex;gap:14px"><a href="#privacy" style="color:#8a8a8a">מדיניות פרטיות</a><a href="#terms" style="color:#8a8a8a">תנאי שימוש</a><a href="contact.html" style="color:#8a8a8a">צור קשר</a></div>
  </div>

</div>
</div>

<script>
var STEPS = [
  { k:"מה מעניין אותך", q:"מה תרצו להסדיר?", h:"אפשר לבחור אפשרות אחת. תמיד אפשר להוסיף בהמשך.",
    o:["ייפוי כוח מתמשך","צוואה","את שני המסמכים","עוד לא בטוח, רוצה להבין"] },
  { k:"מצב אישי", q:"מה המצב האישי שלכם?", h:"זה משפיע על מי נחשב יורש על פי חוק.",
    o:["נשוי/אה","ידוע/ה בציבור","גרוש/ה או פרוד/ה","יחיד/ה"] },
  { k:"משפחה", q:"יש לכם ילדים?", h:"גם ילדים מקשר קודם חשובים לתמונה.",
    o:["אין ילדים","ילדים מתחת לגיל 18","ילדים מעל גיל 18","ילדים מיותר מקשר אחד"] },
  { k:"רכוש", q:"אילו נכסים תרצו להסדיר?", h:"אפשר לבחור כמה תשובות.", multi:true,
    o:["דירה או בית","חסכונות וקרנות","עסק או מניות","נכס בחו\"ל","רכב או מיטלטלין"] },
  { k:"מעורבות המשפחה", q:"האם חשוב לכם שבני המשפחה יהיו מעורבים בניהול העניינים?", h:"אפשר לבחור תשובה אחת.",
    o:["כן, מאוד","כן, במידה מסוימת","לא"] },
  { k:"מיופה כוח", q:"מי האדם שאתם שוקלים למנות?", h:"אין צורך בהחלטה סופית בשלב הזה.",
    o:["בן או בת הזוג","אחד הילדים","קרוב משפחה אחר","עוד לא החלטנו"] },
  { k:"סיום", q:"מצאנו שהשירות שלנו מתאים לכם", h:"לפי התשובות שלכם, אפשר להסדיר את המסמכים בתהליך אחד. השאירו פרטים ועורך דין מהמשרד יחזור אליכם בתוך יום עסקים אחד.", contact:true }
];
var step = 0, answers = {};
var $ = function (id) { return document.getElementById(id); };

function optStyle(on) {
  return "display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;font-family:inherit;font-size:15px;padding:16px 18px;cursor:pointer;width:100%;color:#1a1a1a;background:" +
    (on ? "#f2f2f2" : "#fafafa") + ";border:1px solid " + (on ? "#2b2b2b" : "#dcdcdc");
}

function answered() {
  var s = STEPS[step];
  if (s.contact) {
    return $("cName").value.trim().length > 1 && ($("cPhone").value.trim().length > 5 || $("cMail").value.trim().length > 5);
  }
  var a = answers[step];
  return s.multi ? (a && a.length > 0) : (a !== undefined);
}

function refreshNext() {
  var ok = answered(), last = step === STEPS.length - 1;
  $("next").textContent = last ? "שליחה וסיום" : "המשך ←";
  $("next").style.background = ok ? "#2b2b2b" : "#bdbdbd";
  $("next").style.cursor = ok ? "pointer" : "not-allowed";
}

function render() {
  var s = STEPS[step];
  $("stepNum").textContent = step + 1;
  $("bar").style.width = Math.round(((step + 1) / STEPS.length) * 100) + "%";
  $("kicker").textContent = s.k;
  $("question").textContent = s.q;
  $("hint").textContent = s.h;
  $("options").innerHTML = "";
  $("options").style.display = s.contact ? "none" : "flex";
  $("contactStep").style.display = s.contact ? "grid" : "none";
  $("resultNote").style.display = s.contact ? "block" : "none";
  if (!s.contact) {
    s.o.forEach(function (label, i) {
      var a = answers[step];
      var on = s.multi ? (a && a.indexOf(i) > -1) : a === i;
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("style", optStyle(on));
      b.innerHTML = "<span></span><span style='font-size:14px;color:#2b2b2b'>" + (on ? "✓" : "") + "</span>";
      b.firstChild.textContent = label;
      b.onclick = function () {
        if (s.multi) {
          var cur = answers[step] ? answers[step].slice() : [];
          var at = cur.indexOf(i);
          if (at > -1) cur.splice(at, 1); else cur.push(i);
          answers[step] = cur;
        } else {
          answers[step] = i;
        }
        render();
      };
      $("options").appendChild(b);
    });
  }
  refreshNext();
}

$("back").onclick = function () {
  if (step > 0) { step--; render(); } else { window.location.href = "index.html"; }
};
$("next").onclick = function () {
  if (!answered()) return;
  if (step === STEPS.length - 1) { window.location.href = "upsell.html"; return; }
  step++; render();
};
["cName", "cPhone", "cMail"].forEach(function (id) { $(id).addEventListener("input", refreshNext); });
render();
</script>
</body>
</html>
